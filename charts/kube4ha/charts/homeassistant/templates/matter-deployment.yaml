{{- if and .Values.matterServer.enabled (eq .Values.configSeed.mode "seed") }}
{{- if or .Values.matterServer.backup.enabled .Values.matterServer.timeSync.enabled }}
{{- if not (hasPrefix "/" .Values.matterServer.backup.controlPath) }}
{{- fail "matterServer.backup.controlPath must be an absolute host path" }}
{{- end }}
{{- end }}
# Matter runs in its own pod so Home Assistant rollouts, configuration
# changes, and custom-integration updates never restart the controller. Every
# controller restart forces a new CASE handshake with each paired device, and
# sleepy Thread devices can take minutes to hours to accept one again.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "homeassistant.matterName" . }}
  labels:
    {{- include "homeassistant.labels" . | nindent 4 }}
    app.kubernetes.io/component: matter-server
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "homeassistant.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: matter-server
  # Only one process may own the fabric storage and the loopback port.
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        matter.revision: {{ include (print $.Template.BasePath "/matter-runtime.yaml") . | sha256sum }}
        {{- with .Values.matterServer.podAnnotations }}{{- toYaml . | nindent 8 }}{{- end }}
      labels:
        {{- include "homeassistant.labels" . | nindent 8 }}
        app.kubernetes.io/component: matter-server
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      # Device discovery needs the node's LAN interfaces, IPv6 routes, and
      # multicast. The loopback API stays reachable from the Home Assistant pod
      # because both pods share the node's network namespace.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      # Closing WebSocket clients can take 30 seconds before storage flushes.
      terminationGracePeriodSeconds: 180
      affinity:
        # The snapshot directory lives on Home Assistant's ReadWriteOnce claim
        # and the control socket is a node-local path, so Matter must run on
        # the Home Assistant pod's node.
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  {{- include "homeassistant.selectorLabels" . | nindent 18 }}
                  app.kubernetes.io/component: server
              topologyKey: kubernetes.io/hostname
        {{- with .Values.affinity }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      initContainers:
        - name: matter-state-initialize
          image: "{{ .Values.image.repository | default "homeassistant/home-assistant" }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          command: ["python3", "/opt/kube4ha-matter/initialize.py"]
          env:
            - name: MATTER_SERVER_IMAGE
              value: "{{ .Values.matterServer.image.repository }}:{{ .Values.matterServer.image.tag }}"
            - name: MATTER_TIME_SYNC_ENABLED
              value: {{ .Values.matterServer.timeSync.enabled | quote }}
            - name: MATTER_CONTROL_ENABLED
              value: {{ (or .Values.matterServer.backup.enabled .Values.matterServer.timeSync.enabled) | quote }}
            - name: MATTER_BACKUP_ENABLED
              value: {{ .Values.matterServer.backup.enabled | quote }}
            - name: PORT
              value: {{ .Values.matterServer.port | quote }}
          volumeMounts:
            - name: matter-data
              mountPath: /data
            - name: config
              mountPath: /config
            - name: matter-runtime
              mountPath: /opt/kube4ha-matter
              readOnly: true
            {{- if or .Values.matterServer.backup.enabled .Values.matterServer.timeSync.enabled }}
            - name: matter-control
              mountPath: /run/kube4ha-matter
            {{- end }}
      containers:
        - name: matter-server
          image: "{{ .Values.matterServer.image.repository }}:{{ .Values.matterServer.image.tag }}"
          imagePullPolicy: {{ .Values.matterServer.image.pullPolicy }}
          {{- if or .Values.matterServer.backup.enabled .Values.matterServer.timeSync.enabled }}
          command: ["node", "/opt/kube4ha-matter/supervisor.mjs"]
          {{- end }}
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          env:
            - name: MATTER_SERVER_IMAGE
              value: "{{ .Values.matterServer.image.repository }}:{{ .Values.matterServer.image.tag }}"
            - name: MATTER_TIME_SYNC_ENABLED
              value: {{ .Values.matterServer.timeSync.enabled | quote }}
            - name: MATTER_BACKUP_ENABLED
              value: {{ .Values.matterServer.backup.enabled | quote }}
            - name: STORAGE_PATH
              value: /data/server
            - name: LISTEN_ADDRESS
              value: "127.0.0.1"
            - name: PORT
              value: {{ .Values.matterServer.port | quote }}
            {{- with .Values.matterServer.primaryInterface }}
            - name: PRIMARY_INTERFACE
              value: {{ . | quote }}
            {{- end }}
          # With the backup helper, health is reported through the supervisor's
          # control socket so the probe also proves the socket works.
          {{- $healthCommand := list "/usr/local/bin/healthcheck.sh" }}
          {{- if or .Values.matterServer.backup.enabled .Values.matterServer.timeSync.enabled }}
          {{- $healthCommand = list "curl" "--fail" "--silent" "--max-time" "5" "--output" "/dev/null" "--unix-socket" "/run/kube4ha-matter/control.sock" "http://localhost/health" }}
          {{- end }}
          startupProbe:
            exec:
              command: {{ $healthCommand | toJson }}
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 120
          readinessProbe:
            exec:
              command: {{ $healthCommand | toJson }}
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: {{ $healthCommand | toJson }}
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          {{- with .Values.matterServer.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: matter-data
              mountPath: /data
            - name: matter-runtime
              mountPath: /opt/kube4ha-matter
              readOnly: true
            {{- if or .Values.matterServer.backup.enabled .Values.matterServer.timeSync.enabled }}
            - name: matter-control
              mountPath: /run/kube4ha-matter
            {{- end }}
            {{- if .Values.matterServer.backup.enabled }}
            - name: config
              mountPath: /backup
              subPath: .kube4ha/matter
            {{- end }}
      volumes:
        - name: matter-runtime
          configMap:
            name: {{ include "homeassistant.fullname" . }}-matter-runtime
        - name: matter-data
          persistentVolumeClaim:
            claimName: {{ .Values.matterServer.persistence.existingClaim | default (printf "%s-matter-pvc" (include "homeassistant.fullname" .)) }}
        - name: config
          persistentVolumeClaim:
            claimName: {{ include "homeassistant.fullname" . }}-pvc
        {{- if or .Values.matterServer.backup.enabled .Values.matterServer.timeSync.enabled }}
        - name: matter-control
          hostPath:
            path: {{ .Values.matterServer.backup.controlPath | quote }}
            type: DirectoryOrCreate
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
