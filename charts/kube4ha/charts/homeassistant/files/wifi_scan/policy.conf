<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Managed by kube4ha Wi-Fi listing. -->
  <policy user="root">
    <allow own="io.github.fiam.Kube4ha.Wifi"/>
    <allow send_destination="io.github.fiam.Kube4ha.Wifi"/>
  </policy>
</busconfig>
