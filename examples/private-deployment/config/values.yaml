# These storage and Gateway values match the documented single-node k3s setup.
# For another Kubernetes distribution, select its StorageClass and attach the
# HTTPRoutes to its Gateway.

zigbee2mqtt:
  image:
    tag: "2.14.2"
  config:
    serial:
      port: /dev/ttyACM0
      adapter: ember
  persistence:
    enabled: true
    size: 2Gi
    storageClass: local-path
  httpRoute:
    enabled: true
    parentRefs:
      - name: traefik-gateway
        namespace: kube-system
        sectionName: web

homeassistant:
  image:
    tag: "2026.9.0"
  config:
    name: "Home"
    volume:
      size: 20Gi
      storageClass: local-path
  httpRoute:
    enabled: true
    parentRefs:
      - name: traefik-gateway
        namespace: kube-system
        sectionName: web

mosquitto:
  persistence:
    enabled: true
    size: 5Gi
    storageClass: local-path
