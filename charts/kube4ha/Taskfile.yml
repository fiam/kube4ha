version: '3'

vars:
  HELM_REQUESTED_CONFIG_DIR: '{{.KUBE4HA_CONFIG_DIR | default .DOMOTIC_CONFIG_DIR | default (printf "%s/../.." .ROOT_DIR)}}'
  HELM_CONFIG_DIR: '{{if isAbs (toString .HELM_REQUESTED_CONFIG_DIR)}}{{.HELM_REQUESTED_CONFIG_DIR}}{{else}}{{joinPath .USER_WORKING_DIR (toString .HELM_REQUESTED_CONFIG_DIR)}}{{end}}'
  HELM_RELEASE_NAME: '{{.RELEASE_NAME | default "kube4ha"}}'
  HELM_NAMESPACE: '{{.NAMESPACE | default "kube4ha"}}'
  HELM_KUBE_CONTEXT: '{{.KUBE_CONTEXT | default ""}}'
  HELM_TERRAFORM_VALUES_FILE: '{{.KUBE4HA_GENERATED_HELM_VALUES_FILE | default .DOMOTIC_GENERATED_HELM_VALUES_FILE | default (printf "%s/infra/helm-values.yaml" .HELM_CONFIG_DIR)}}'
  HELM_VALUES_FILE: '{{.KUBE4HA_PRIVATE_HELM_VALUES_FILE | default .DOMOTIC_PRIVATE_HELM_VALUES_FILE | default (printf "%s/values.yaml" .HELM_CONFIG_DIR)}}'
  HELM_RESOLVED_TIMEOUT: '{{.HELM_TIMEOUT | default "10m"}}'

tasks:
  default:
    desc: List Helm tasks
    cmds:
      - task --list

  deploy:
    desc: Install or upgrade the kube4ha release
    preconditions:
      - sh: command -v helm >/dev/null
        msg: Install Helm before running chart tasks.
      - sh: test -f "{{.HELM_TERRAFORM_VALUES_FILE}}"
        msg: Run `task infra:apply` to generate infra/helm-values.yaml first.
      - sh: test -f "{{.HELM_VALUES_FILE}}"
        msg: Copy an example to values.yaml and customize it first.
    cmds:
      - >-
        helm upgrade --install "{{.HELM_RELEASE_NAME}}" .
        --namespace "{{.HELM_NAMESPACE}}"
        --create-namespace
        {{if .HELM_KUBE_CONTEXT}}--kube-context "{{.HELM_KUBE_CONTEXT}}"{{end}}
        --values "{{.HELM_TERRAFORM_VALUES_FILE}}"
        --values "{{.HELM_VALUES_FILE}}"
        --rollback-on-failure
        --wait
        --timeout "{{.HELM_RESOLVED_TIMEOUT}}"

  uninstall:
    desc: Uninstall the kube4ha release
    cmds:
      - >-
        helm uninstall "{{.HELM_RELEASE_NAME}}"
        --namespace "{{.HELM_NAMESPACE}}"
        {{if .HELM_KUBE_CONTEXT}}--kube-context "{{.HELM_KUBE_CONTEXT}}"{{end}}
        --ignore-not-found

  status:
    desc: Show the Helm release and workload status
    cmds:
      - >-
        helm status "{{.HELM_RELEASE_NAME}}" --namespace "{{.HELM_NAMESPACE}}"
        {{if .HELM_KUBE_CONTEXT}}--kube-context "{{.HELM_KUBE_CONTEXT}}"{{end}}
      - >-
        kubectl
        {{if .HELM_KUBE_CONTEXT}}--context "{{.HELM_KUBE_CONTEXT}}"{{end}}
        --namespace "{{.HELM_NAMESPACE}}" get pods,cronjobs,jobs,httproutes

  template:
    desc: Render the chart locally with minimal example values
    cmds:
      - helm template "{{.HELM_RELEASE_NAME}}" . --namespace "{{.HELM_NAMESPACE}}" --values ../../examples/values-minimal.yaml

  lint:
    desc: Lint the Helm chart
    cmds:
      - helm lint .

  check:
    desc: Lint and test the Helm chart renderings
    cmds:
      - task: lint
      - |
        matter_render="$(helm template matter-test charts/homeassistant \
          --set onboarding.enabled=true \
          --set onboarding.existingSecret.name=test-owner)"
        printf '%s\n' "$matter_render" | grep -Fq 'image: "ghcr.io/matter-js/matterjs-server:1.5.5"'
        printf '%s\n' "$matter_render" | grep -Fq 'name: matter-server'
        printf '%s\n' "$matter_render" | grep -Fq 'value: "127.0.0.1"'
        printf '%s\n' "$matter_render" | grep -Fq 'value: "ws://127.0.0.1:5580/ws"'
        printf '%s\n' "$matter_render" | grep -Fq 'helm.sh/resource-policy: keep'
        printf '%s\n' "$matter_render" | grep -Fq 'claimName: matter-test-homeassistant-matter-pvc'
        printf '%s\n' "$matter_render" | grep -Fq 'subPath: .kube4ha/matter'
        printf '%s\n' "$matter_render" | grep -Fq 'name: KUBE4HA_MATTER_BACKUP_ENABLED'
        printf '%s\n' "$matter_render" | grep -Fq 'name: matter-backup-install'
        printf '%s\n' "$matter_render" | grep -Fq 'name: matter-state-initialize'
        # Matter runs in its own Deployment so Home Assistant rollouts never
        # restart the controller. Both pods share the node's network namespace
        # and the control socket directory.
        matter_deployment="$(helm template matter-test charts/homeassistant \
          --show-only templates/matter-deployment.yaml)"
        printf '%s\n' "$matter_deployment" | grep -Fq 'name: matter-test-homeassistant-matter'
        printf '%s\n' "$matter_deployment" | grep -Fq 'app.kubernetes.io/component: matter-server'
        printf '%s\n' "$matter_deployment" | grep -Fq 'hostNetwork: true'
        printf '%s\n' "$matter_deployment" | grep -Fq 'automountServiceAccountToken: false'
        printf '%s\n' "$matter_deployment" | grep -Fq 'type: Recreate'
        printf '%s\n' "$matter_deployment" | grep -Fq 'terminationGracePeriodSeconds: 180'
        printf '%s\n' "$matter_deployment" | grep -Fq 'requiredDuringSchedulingIgnoredDuringExecution:'
        printf '%s\n' "$matter_deployment" | grep -Fq 'topologyKey: kubernetes.io/hostname'
        printf '%s\n' "$matter_deployment" | grep -Fq 'path: "/run/kube4ha-matter"'
        printf '%s\n' "$matter_deployment" | grep -Fq 'name: matter-state-initialize'
        printf '%s\n' "$matter_deployment" | grep -Fq 'name: matter-server'
        ha_deployment="$(helm template matter-test charts/homeassistant \
          --show-only templates/deployment.yaml)"
        if printf '%s\n' "$ha_deployment" | grep -Eq 'name: matter-server|name: matter-state-initialize|name: matter-data|name: matter-runtime|matter.revision'; then
          echo 'the Matter controller must not run inside the Home Assistant pod' >&2
          exit 1
        fi
        printf '%s\n' "$ha_deployment" | grep -Fq 'name: matter-backup-install'
        printf '%s\n' "$ha_deployment" | grep -Fq 'path: "/run/kube4ha-matter"'
        printf '%s\n' "$ha_deployment" | grep -Fq 'mountPath: /run/kube4ha-matter'
        # Only Home Assistant pods back the HTTP Service.
        helm template matter-test charts/homeassistant --show-only templates/service.yaml |
          grep -Fq 'app.kubernetes.io/component: server'
        if helm template matter-test charts/homeassistant \
          --set matterServer.backup.controlPath=relative >/dev/null 2>&1; then
          echo 'relative Matter control paths must fail rendering' >&2
          exit 1
        fi
        # A separate claim must not be mounted under HA's /config, which is
        # replaced during native restoration.
        if printf '%s\n' "$matter_render" | grep -q 'mountPath: /config/'; then
          echo 'Matter must not shadow a directory in Home Assistant native backups' >&2
          exit 1
        fi
        disabled_render="$(helm template matter-test charts/homeassistant \
          --set onboarding.enabled=true \
          --set onboarding.existingSecret.name=test-owner \
          --set matterServer.enabled=false)"
        if printf '%s\n' "$disabled_render" | grep -Eq 'name: matter-server|matter-pvc|name: MATTER_SERVER_URL|name: matter-data-permissions|component: matter-server'; then
          echo 'disabled Matter must not render its Deployment, claim, init container, or bootstrap URL' >&2
          exit 1
        fi
        custom_render="$(helm template matter-test charts/homeassistant \
          --set onboarding.enabled=true \
          --set onboarding.existingSecret.name=test-owner \
          --set matterServer.port=5581 \
          --set matterServer.primaryInterface=enp1s0 \
          --set matterServer.persistence.existingClaim=existing-matter)"
        printf '%s\n' "$custom_render" | grep -Fq 'value: "ws://127.0.0.1:5581/ws"'
        printf '%s\n' "$custom_render" | grep -Fq 'value: "enp1s0"'
        printf '%s\n' "$custom_render" | grep -Fq 'claimName: existing-matter'
        if printf '%s\n' "$custom_render" | grep -q 'name: matter-test-homeassistant-matter-pvc'; then
          echo 'existing Matter claims must not be recreated' >&2
          exit 1
        fi
        for invalid in replicaCount=2 autoscaling.enabled=true matterServer.port=8123 matterServer.port=80 matterServer.image.tag=stable; do
          if helm template matter-test charts/homeassistant --set "$invalid" >/dev/null 2>&1; then
            echo "unsafe Matter configuration must fail rendering: $invalid" >&2
            exit 1
          fi
        done
        restore_matter="$(helm template matter-test charts/homeassistant --set configSeed.mode=restore)"
        if printf '%s\n' "$restore_matter" | grep -Eq 'name: matter-server|name: matter-state-initialize|kind: Job|matter-test-homeassistant-matter-pvc|component: matter-server'; then
          echo 'restore mode must not start Matter or provision a new fabric before HA recovery' >&2
          exit 1
        fi
        no_backup="$(helm template matter-test charts/homeassistant --set matterServer.backup.enabled=false)"
        printf '%s\n' "$no_backup" | grep -Fq 'name: matter-server'
        if printf '%s\n' "$no_backup" | grep -Eq 'name: matter-backup-install|name: matter-control|supervisor.mjs"\]'; then
          echo 'disabling Matter backup must disable its integration installer, control socket, and supervisor' >&2
          exit 1
        fi
      - |
        time_only="$(helm template matter-time-test charts/homeassistant --set matterServer.timeSync.enabled=true --set matterServer.backup.enabled=false)"
        printf '%s\n' "$time_only" | grep -Fq 'name: matter-backup-install'
        printf '%s\n' "$time_only" | grep -Fq 'name: matter-control'
        printf '%s\n' "$time_only" | grep -Fq 'command: ["node", "/opt/kube4ha-matter/supervisor.mjs"]'
        printf '%s\n' "$time_only" | grep -Fq 'name: KUBE4HA_MATTER_TIME_SYNC_ENABLED'
        if printf '%s\n' "$time_only" | grep -Fq 'mountPath: /backup'; then
          echo 'time sync without backups must not require the backup subdirectory' >&2
          exit 1
        fi
        for setting in matterServer.enabled=false configSeed.mode=restore; do
          inactive="$(helm template matter-time-test charts/homeassistant --set matterServer.timeSync.enabled=true --set "$setting")"
          if printf '%s\n' "$inactive" | grep -Eq 'name: matter-control|component: matter-server'; then
            echo 'disabled/restore mode must keep time sync inactive' >&2
            exit 1
          fi
        done
      - |
        helm template "{{.HELM_RELEASE_NAME}}" . \
          --namespace "{{.HELM_NAMESPACE}}" \
          --kube-version 1.23.0 \
          --values ../../examples/values-minimal.yaml >/dev/null
        if helm template "{{.HELM_RELEASE_NAME}}" . \
          --namespace "{{.HELM_NAMESPACE}}" \
          --kube-version 1.22.17 \
          --values ../../examples/values-minimal.yaml >/dev/null 2>&1; then
          echo 'Kubernetes releases older than 1.23 must fail chart validation' >&2
          exit 1
        fi
      - |
        ha_version="$(awk '$1 == "appVersion:" {gsub(/"/, "", $2); print $2}' charts/homeassistant/Chart.yaml)"
        # The default HACS version is maintained in lockstep with the default
        # Home Assistant version; see the hacs block in the chart values.
        hacs_version="$(awk 'in_hacs && $1 == "version:" {gsub(/"/, "", $2); print $2; exit} /^hacs:/ {in_hacs=1}' charts/homeassistant/values.yaml)"
        cloudflared_version="$(awk '$1 == "appVersion:" {gsub(/"/, "", $2); print $2}' charts/cloudflared/Chart.yaml)"
        zigbee2mqtt_version="$(awk '$1 == "appVersion:" {gsub(/"/, "", $2); print $2}' charts/zigbee2mqtt/Chart.yaml)"
        parent_version="$(awk '$1 == "appVersion:" {gsub(/"/, "", $2); print $2}' Chart.yaml)"
        test -n "$ha_version"
        test -n "$hacs_version"
        test -n "$cloudflared_version"
        test -n "$zigbee2mqtt_version"
        test "$parent_version" = "$ha_version"
        for values_file in \
          ../../examples/values-minimal.yaml \
          ../../examples/values-kind.yaml \
          ../../examples/values-production.yaml
        do
          rendered="$(helm template "{{.HELM_RELEASE_NAME}}" . \
            --namespace "{{.HELM_NAMESPACE}}" \
            --values "$values_file")"
          printf '%s\n' "$rendered" |
            grep -F "image: \"homeassistant/home-assistant:${ha_version}\"" >/dev/null
          printf '%s\n' "$rendered" |
            grep -F "image: \"cloudflare/cloudflared:${cloudflared_version}\"" >/dev/null
          printf '%s\n' "$rendered" |
            grep -F "image: \"koenkk/zigbee2mqtt:${zigbee2mqtt_version}\"" >/dev/null
          if printf '%s\n' "$rendered" |
            grep -E 'image: [^[:space:]]+:latest(["[:space:]]|$)' >/dev/null; then
            echo "$values_file renders a mutable latest image" >&2
            exit 1
          fi
          if printf '%s\n' "$rendered" | grep -q 'mountPath: /config/custom_components/'; then
            echo "$values_file must not select a custom integration" >&2
            exit 1
          fi
          printf '%s\n' "$rendered" | grep -q 'name: hacs-install'
          printf '%s\n' "$rendered" |
            grep -Fq "releases/download/${hacs_version}/hacs.zip"
          if [ "$values_file" = ../../examples/values-kind.yaml ]; then
            if printf '%s\n' "$rendered" | grep -q 'name: host-dbus'; then
              echo 'kind values must not mount the host D-Bus directory' >&2
              exit 1
            fi
          else
            printf '%s\n' "$rendered" | grep -q 'name: host-dbus'
            printf '%s\n' "$rendered" | grep -Fq 'path: "/run/dbus"'
          fi
        done
        production_render="$(helm template "{{.HELM_RELEASE_NAME}}" . \
          --namespace "{{.HELM_NAMESPACE}}" \
          --values ../../examples/values-production.yaml)"
        printf '%s\n' "$production_render" |
          grep -Fq 'storageClassName: "local-path"'
        printf '%s\n' "$production_render" |
          grep -Fq 'storage: 20Gi'
      - |
        remote_render="$(helm template "{{.HELM_RELEASE_NAME}}" . \
          --namespace "{{.HELM_NAMESPACE}}" \
          --values ../../examples/values-minimal.yaml \
          --set 'homeassistant.customComponents.remote[0].name=example_integration' \
          --set 'homeassistant.customComponents.remote[0].url=https://example.invalid/fixture.tar.gz' \
          --set 'homeassistant.customComponents.remote[0].sha256=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef' \
          --set 'homeassistant.customComponents.remote[0].archivePath=fixture/custom_components/example_integration')"
        printf '%s\n' "$remote_render" | grep -q 'name: custom-example-integration'
        printf '%s\n' "$remote_render" | grep -Fq 'target="/config/custom_components/$COMPONENT_NAME"'
        printf '%s\n' "$remote_render" | grep -q 'name: custom-components-reconcile'
        printf '%s\n' "$remote_render" | grep -q 'managed-custom-components'
        if printf '%s\n' "$remote_render" | grep -q 'mountPath: /config/custom_components/'; then
          echo 'custom integrations must not create read-only mounts below /config' >&2
          exit 1
        fi
        printf '%s\n' "$remote_render" | grep -q 'sha256sum -c -'
        printf '%s\n' "$remote_render" | grep -q 'Custom component archive contains an unsafe path'
        if helm template "{{.HELM_RELEASE_NAME}}" . \
          --namespace "{{.HELM_NAMESPACE}}" \
          --values ../../examples/values-minimal.yaml \
          --set 'homeassistant.customComponents.remote[0].name=fixture' \
          --set 'homeassistant.customComponents.remote[0].url=http://example.invalid/fixture.tar.gz' \
          --set 'homeassistant.customComponents.remote[0].sha256=invalid' \
          --set 'homeassistant.customComponents.remote[0].archivePath=../fixture' \
          >/dev/null 2>&1; then
          echo 'unsafe remote custom component values must fail rendering' >&2
          exit 1
        fi
      - |
        hacs_render="$(helm template "{{.HELM_RELEASE_NAME}}" . \
          --namespace "{{.HELM_NAMESPACE}}" \
          --values ../../examples/values-minimal.yaml)"
        printf '%s\n' "$hacs_render" | grep -q 'name: hacs-install'
        printf '%s\n' "$hacs_render" | grep -q 'HACS_SHA256'
        printf '%s\n' "$hacs_render" | grep -q 'sha256sum -c -'
        printf '%s\n' "$hacs_render" | grep -q 'HACS archive contains an unsafe path'
        printf '%s\n' "$hacs_render" | grep -Fq 'test -f /work/unpacked/manifest.json'
        printf '%s\n' "$hacs_render" | grep -qx '              hacs'
        printf '%s\n' "$hacs_render" | grep -q 'mountPath: /run/dbus'
        printf '%s\n' "$hacs_render" | grep -q 'readOnly: true'
        disabled_render="$(helm template "{{.HELM_RELEASE_NAME}}" . \
          --namespace "{{.HELM_NAMESPACE}}" \
          --values ../../examples/values-minimal.yaml \
          --set homeassistant.hacs.enabled=false \
          --set homeassistant.hostDbus.enabled=false)"
        if printf '%s\n' "$disabled_render" | grep -q 'name: hacs-install'; then
          echo 'disabled HACS must not render an installer' >&2
          exit 1
        fi
        if printf '%s\n' "$disabled_render" | grep -qx '              hacs'; then
          echo 'disabled HACS must not remain a reconcile-managed component' >&2
          exit 1
        fi
        if printf '%s\n' "$disabled_render" | grep -q 'name: host-dbus'; then
          echo 'disabled hostDbus must not mount the host D-Bus directory' >&2
          exit 1
        fi
        if helm template "{{.HELM_RELEASE_NAME}}" . \
          --namespace "{{.HELM_NAMESPACE}}" \
          --values ../../examples/values-minimal.yaml \
          --set homeassistant.hacs.sha256=invalid \
          >/dev/null 2>&1; then
          echo 'invalid HACS sha256 values must fail rendering' >&2
          exit 1
        fi
        if helm template "{{.HELM_RELEASE_NAME}}" . \
          --namespace "{{.HELM_NAMESPACE}}" \
          --values ../../examples/values-minimal.yaml \
          --set homeassistant.hacs.version=latest \
          >/dev/null 2>&1; then
          echo 'mutable HACS versions must fail rendering' >&2
          exit 1
        fi
        if helm template "{{.HELM_RELEASE_NAME}}" . \
          --namespace "{{.HELM_NAMESPACE}}" \
          --values ../../examples/values-minimal.yaml \
          --set 'homeassistant.customComponents.remote[0].name=hacs' \
          --set 'homeassistant.customComponents.remote[0].url=https://example.invalid/fixture.tar.gz' \
          --set 'homeassistant.customComponents.remote[0].sha256=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef' \
          --set 'homeassistant.customComponents.remote[0].archivePath=fixture/custom_components/hacs' \
          >/dev/null 2>&1; then
          echo 'custom components named hacs must fail rendering while HACS is enabled' >&2
          exit 1
        fi
        if helm template "{{.HELM_RELEASE_NAME}}" . \
          --namespace "{{.HELM_NAMESPACE}}" \
          --values ../../examples/values-minimal.yaml \
          --set 'homeassistant.volumes[0].name=host-dbus' \
          --set 'homeassistant.volumes[0].hostPath.path=/run/dbus' \
          >/dev/null 2>&1; then
          echo 'manual host-dbus volumes must fail rendering while hostDbus is enabled' >&2
          exit 1
        fi
      - |
        nozigbee_render="$(helm template "{{.HELM_RELEASE_NAME}}" . \
          --namespace "{{.HELM_NAMESPACE}}" \
          --values ../../examples/values-minimal.yaml \
          --set zigbee2mqtt.enabled=false)"
        if printf '%s\n' "$nozigbee_render" | grep -q 'koenkk/zigbee2mqtt'; then
          echo 'disabled Zigbee2MQTT must not render its deployment' >&2
          exit 1
        fi
        printf '%s\n' "$nozigbee_render" | grep -q 'name: hacs-install'
        printf '%s\n' "$nozigbee_render" | grep -Fq 'image: "homeassistant/home-assistant:'
      - |
        backup_render="$(helm template "{{.HELM_RELEASE_NAME}}" . \
          --namespace "{{.HELM_NAMESPACE}}" \
          --values ../../examples/values-minimal.yaml \
          --set homeassistant.zigbee2mqttBackup.enabled=true \
          --set homeassistant.zigbee2mqttBackup.mqtt.server=kube4ha-mosquitto)"
        printf '%s\n' "$backup_render" | grep -Fq 'kind: CronJob'
        printf '%s\n' "$backup_render" | grep -Fq 'concurrencyPolicy: Forbid'
        printf '%s\n' "$backup_render" | grep -Fq 'requiredDuringSchedulingIgnoredDuringExecution:'
        printf '%s\n' "$backup_render" | grep -Fq 'topologyKey: kubernetes.io/hostname'
        printf '%s\n' "$backup_render" | grep -Fq 'app.kubernetes.io/component: server'
        printf '%s\n' "$backup_render" | grep -Fq 'claimName: kube4ha-homeassistant-pvc'
        printf '%s\n' "$backup_render" | grep -Fq 'mosquitto_rr "$@"'
        printf '%s\n' "$backup_render" | grep -Fq 'unzip -t "$archive_file"'
        printf '%s\n' "$backup_render" | grep -Fq 'value: "kube4ha-mosquitto"'
        if helm template "{{.HELM_RELEASE_NAME}}" . \
          --namespace "{{.HELM_NAMESPACE}}" \
          --values ../../examples/values-minimal.yaml \
          --set homeassistant.zigbee2mqttBackup.enabled=true \
          --set homeassistant.zigbee2mqttBackup.mqtt.server=kube4ha-mosquitto \
          --set homeassistant.zigbee2mqttBackup.directory=../outside \
          >/dev/null 2>&1; then
          echo 'unsafe Zigbee2MQTT backup directories must fail rendering' >&2
          exit 1
        fi
      - |
        seed_render="$(helm template "{{.HELM_RELEASE_NAME}}" . \
          --namespace "{{.HELM_NAMESPACE}}" \
          --values ../../examples/values-minimal.yaml \
          --set homeassistant.onboarding.enabled=true \
          --set homeassistant.onboarding.existingSecret.name=homeassistant-onboarding \
          --set homeassistant.r2Backup.enabled=true \
          --set homeassistant.r2Backup.bucket=kube4ha-test-backups \
          --set homeassistant.r2Backup.endpointUrl=https://example.invalid \
          --set homeassistant.r2Backup.existingSecret.name=homeassistant-r2-credentials \
          --set homeassistant.r2Backup.automatic.enabled=true \
          --set homeassistant.r2Backup.automatic.agentName=kube4ha-test-backups \
          --set homeassistant.r2Backup.automatic.existingSecret.name=homeassistant-backup-encryption)"
        printf '%s\n' "$seed_render" | grep -q 'name: kube4ha-homeassistant-onboarding'
        printf '%s\n' "$seed_render" | grep -q 'Home Assistant onboarding is complete'
        printf '%s\n' "$seed_render" | grep -q 'config/core/update'
        printf '%s\n' "$seed_render" | grep -q '/api/config/config_entries/flow'
        printf '%s\n' "$seed_render" | grep -q '"http/config/configure"'
        printf '%s\n' "$seed_render" | grep -q '"http/config/promote"'
        printf '%s\n' "$seed_render" | grep -q 'Created {handler} through its config flow'
        printf '%s\n' "$seed_render" | grep -q 'name: HOMEASSISTANT_EXTERNAL_URL'
        printf '%s\n' "$seed_render" | grep -q 'name: HOMEASSISTANT_INTERNAL_URL'
        printf '%s\n' "$seed_render" | grep -q 'name: R2_ACCESS_KEY_ID'
        printf '%s\n' "$seed_render" | grep -q 'backup/config/update'
        printf '%s\n' "$seed_render" | grep -q 'name: homeassistant-backup-encryption'
        if printf '%s\n' "$seed_render" | grep -q -E '\.storage-http|\.storage-core\.config_entries'; then
          echo 'private Home Assistant storage seeds must not be rendered' >&2
          exit 1
        fi
        if printf '%s\n' "$seed_render" | grep -q 'mountPath: /config/configuration.yaml'; then
          echo 'configuration.yaml must live on the PVC, not a permanent subPath mount' >&2
          exit 1
        fi
        configuration_render="$(helm template "{{.HELM_RELEASE_NAME}}" . \
          --namespace "{{.HELM_NAMESPACE}}" \
          --values ../../examples/values-minimal.yaml \
          --show-only charts/homeassistant/templates/configmap.yaml)"
        if printf '%s\n' "$configuration_render" | grep -q '^    homeassistant:'; then
          echo 'UI-managed Home Assistant core settings must not be rendered in configuration.yaml' >&2
          exit 1
        fi
        onboarding_script="$(printf '%s\n' "$seed_render" | awk '
          /^            - python3$/ { python = 1 }
          python && /^            - \|$/ { script = 1; next }
          script && /^          env:/ { exit }
          script { sub(/^              /, ""); print }
        ')"
        printf '%s\n' "$onboarding_script" | python3 -c 'import ast, sys; ast.parse(sys.stdin.read())'
        unencrypted_render="$(helm template "{{.HELM_RELEASE_NAME}}" . \
          --namespace "{{.HELM_NAMESPACE}}" \
          --values ../../examples/values-minimal.yaml \
          --set homeassistant.onboarding.enabled=true \
          --set homeassistant.onboarding.existingSecret.name=homeassistant-onboarding \
          --set homeassistant.r2Backup.enabled=true \
          --set homeassistant.r2Backup.bucket=kube4ha-test-backups \
          --set homeassistant.r2Backup.endpointUrl=https://example.invalid \
          --set homeassistant.r2Backup.existingSecret.name=homeassistant-r2-credentials \
          --set homeassistant.r2Backup.automatic.enabled=true \
          --set homeassistant.r2Backup.automatic.agentName=kube4ha-test-backups)"
        if printf '%s\n' "$unencrypted_render" | grep -q 'name: AUTOMATIC_BACKUP_PASSWORD'; then
          echo 'unencrypted backups must not reference a password Secret' >&2
          exit 1
        fi
        printf '%s\n' "$unencrypted_render" | grep -q '"protected": automatic_backup_password is not None'
        printf '%s\n' "$unencrypted_render" | grep -q '"password": automatic_backup_password'
      - |
        restore_render="$(helm template "{{.HELM_RELEASE_NAME}}" . \
          --namespace "{{.HELM_NAMESPACE}}" \
          --values ../../examples/values-minimal.yaml \
          --set homeassistant.configSeed.mode=restore \
          --set homeassistant.onboarding.enabled=true \
          --set homeassistant.onboarding.existingSecret.name=homeassistant-onboarding \
          --set homeassistant.r2Backup.enabled=true \
          --set homeassistant.r2Backup.automatic.enabled=true \
          --set homeassistant.r2Backup.automatic.agentName=kube4ha-test-backups \
          --set homeassistant.r2Backup.automatic.existingSecret.name=homeassistant-backup-encryption)"
        printf '%s\n' "$restore_render" | grep -q 'Creating minimal configuration for native restore'
        if printf '%s\n' "$restore_render" | grep -q 'name: kube4ha-homeassistant-onboarding'; then
          echo 'restore mode must not render the onboarding hook' >&2
          exit 1
        fi
        if printf '%s\n' "$restore_render" | grep -q '/api/config/config_entries/flow'; then
          echo 'restore mode must not render integration seeding' >&2
          exit 1
        fi
