version: '3'

includes:
  bootstrap:
    taskfile: ./bootstrap
    dir: ./bootstrap
    vars:
      KUBE4HA_BOOTSTRAP_VARS_FILE: '{{.ROOT_BOOTSTRAP_VARS_PATH}}'
      KUBE4HA_BOOTSTRAP_STATE_FILE: '{{.ROOT_BOOTSTRAP_STATE_PATH}}'
  infra:
    taskfile: ./infra
    dir: ./infra
    vars:
      KUBE4HA_CONFIG_DIR: '{{.ROOT_CONFIG_DIR}}'
      KUBE4HA_TF_VARS_FILE: '{{.ROOT_TOFU_VARS_PATH}}'
      KUBE4HA_GENERATED_HELM_VALUES_FILE: '{{.ROOT_GENERATED_HELM_VALUES_PATH}}'
      KUBE4HA_PRIVATE_HELM_VALUES_FILE: '{{.ROOT_PRIVATE_HELM_VALUES_PATH}}'
  helm:
    taskfile: ./charts/kube4ha
    dir: ./charts/kube4ha
    vars:
      KUBE4HA_CONFIG_DIR: '{{.ROOT_CONFIG_DIR}}'
      KUBE4HA_GENERATED_HELM_VALUES_FILE: '{{.ROOT_TOFU_HELM_VALUES_PATH}}'
      KUBE4HA_PRIVATE_HELM_VALUES_FILE: '{{.ROOT_PRIVATE_HELM_VALUES_PATH}}'
  dev:
    taskfile: ./dev
    dir: ./dev

vars:
  ROOT_REQUESTED_CONFIG_DIR: '{{.KUBE4HA_CONFIG_DIR | default .DOMOTIC_CONFIG_DIR | default .ROOT_DIR}}'
  ROOT_CONFIG_DIR: '{{if isAbs (toString .ROOT_REQUESTED_CONFIG_DIR)}}{{.ROOT_REQUESTED_CONFIG_DIR}}{{else}}{{joinPath .USER_WORKING_DIR (toString .ROOT_REQUESTED_CONFIG_DIR)}}{{end}}'
  ROOT_BOOTSTRAP_VARS_PATH: '{{.KUBE4HA_BOOTSTRAP_VARS_FILE | default .DOMOTIC_BOOTSTRAP_VARS_FILE | default (printf "%s/bootstrap.tfvars" .ROOT_CONFIG_DIR)}}'
  ROOT_BOOTSTRAP_STATE_PATH: '{{.KUBE4HA_BOOTSTRAP_STATE_FILE | default .DOMOTIC_BOOTSTRAP_STATE_FILE | default (printf "%s/state/bootstrap.tfstate" .ROOT_DIR)}}'
  ROOT_TOFU_VARS_PATH: '{{.KUBE4HA_TF_VARS_FILE | default .DOMOTIC_TF_VARS_FILE | default (printf "%s/infra/terraform.tfvars" .ROOT_CONFIG_DIR)}}'
  ROOT_GENERATED_HELM_VALUES_PATH: '{{.KUBE4HA_GENERATED_HELM_VALUES_FILE | default .DOMOTIC_GENERATED_HELM_VALUES_FILE | default (printf "%s/infra/helm-values.yaml" .ROOT_CONFIG_DIR)}}'
  ROOT_TOFU_HELM_VALUES_PATH: '{{.KUBE4HA_GENERATED_HELM_VALUES_FILE | default .DOMOTIC_GENERATED_HELM_VALUES_FILE | default .ROOT_GENERATED_HELM_VALUES_PATH}}'
  ROOT_PRIVATE_HELM_VALUES_PATH: '{{.KUBE4HA_PRIVATE_HELM_VALUES_FILE | default .DOMOTIC_PRIVATE_HELM_VALUES_FILE | default (printf "%s/values.yaml" .ROOT_CONFIG_DIR)}}'
  ROOT_DEV_CLUSTER_NAME: '{{.CLUSTER_NAME | default "ha"}}'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  check:
    desc: Validate OpenTofu, Helm, scripts, and private configuration
    cmds:
      - task: bootstrap:check
      - task: infra:check
      - task: helm:check
      - task: scripts:check

  scripts:check:
    desc: Validate deployment helper scripts
    cmds:
      - bash -n scripts/*.sh scripts/tests/*.sh
      - bash scripts/tests/private-deployment.sh
      - bash scripts/tests/dev-sync-custom-integrations.sh
      - bash scripts/tests/project-rename.sh
      - python3 scripts/tests/matter-timezone.py
      - python3 scripts/tests/matter-restore.py
      - python3 scripts/tests/integration-installers.py
      - node --test scripts/tests/matter-supervisor.mjs

  config:check:
    desc: Validate a private deployment configuration and its Git boundaries
    cmds:
      - >-
        ./scripts/config-check.sh "{{.ROOT_CONFIG_DIR}}"
        "{{.ROOT_BOOTSTRAP_VARS_PATH}}" "{{.ROOT_BOOTSTRAP_STATE_PATH}}"
        "{{.ROOT_TOFU_VARS_PATH}}" "{{.ROOT_PRIVATE_HELM_VALUES_PATH}}"
        "{{.ROOT_GENERATED_HELM_VALUES_PATH}}"

  deploy:
    desc: Apply infrastructure and deploy the chart
    cmds:
      - task: infra:apply
      - task: helm:deploy

  restore:
    desc: Prepare Home Assistant to import a native backup
    cmds:
      - task: infra:apply
        vars:
          HOMEASSISTANT_BOOTSTRAP_MODE_OVERRIDE: restore
      - task: helm:deploy

  restore:plan:
    desc: Plan the native-backup restore preparation
    cmds:
      - task: infra:plan
        vars:
          HOMEASSISTANT_BOOTSTRAP_MODE_OVERRIDE: restore

  credentials:show:
    desc: Reveal Home Assistant recovery credentials
    prompt: This prints recovery credentials to the terminal. Continue?
    cmds:
      - task: infra:init
      - ./scripts/show-homeassistant-credentials.sh "{{.ROOT_DIR}}/infra"

  credentials:update:
    desc: Record an existing Home Assistant owner credential in encrypted state
    cmds:
      - task: infra:init
      - >-
        ./scripts/update-homeassistant-credentials.sh
        "{{.ROOT_DIR}}/infra" "{{.ROOT_TOFU_VARS_PATH}}"

  zigbee:import:
    desc: Import an existing Zigbee identity into encrypted state
    requires:
      vars: [SOURCE]
    cmds:
      - task: infra:init
      - >-
        ./scripts/zigbee-keys.sh import "{{.SOURCE}}"
        "{{.ROOT_DIR}}/infra" "{{.ROOT_TOFU_VARS_PATH}}"

  restore:complete:
    desc: Record the restored owner credential and resume normal reconciliation
    cmds:
      - task: credentials:update
      - task: deploy

  destroy:
    desc: Uninstall the chart and destroy ordinary infrastructure
    cmds:
      - task: helm:uninstall
      - task: infra:destroy

  bootstrap-local:
    desc: Create the R2 foundation for a source-checkout development stack
    cmds:
      - >-
        ./scripts/with-opentofu-environment.sh
        bootstrap "{{.ROOT_DIR}}" "{{.ROOT_DIR}}" "{{.ROOT_CONFIG_DIR}}" --
        env
        KUBE4HA_BOOTSTRAP_VARS_FILE="{{.ROOT_BOOTSTRAP_VARS_PATH}}"
        KUBE4HA_BOOTSTRAP_STATE_FILE="{{.ROOT_BOOTSTRAP_STATE_PATH}}"
        task --dir "{{.ROOT_DIR}}" bootstrap:apply

  deploy-dev:
    desc: Create Kind and deploy the complete development stack
    vars:
      DEV_TF_VARS_FILE: '{{.KUBE4HA_TF_VARS_FILE | default .DOMOTIC_TF_VARS_FILE | default .ROOT_TOFU_VARS_PATH}}'
      DEV_RESOLVED_TF_VARS_FILE: '{{if isAbs (toString .DEV_TF_VARS_FILE)}}{{.DEV_TF_VARS_FILE}}{{else}}{{joinPath .USER_WORKING_DIR (toString .DEV_TF_VARS_FILE)}}{{end}}'
    cmds:
      - task: dev:create
        vars:
          CLUSTER_NAME: '{{.ROOT_DEV_CLUSTER_NAME}}'
      - |
        expected_context='kind-{{.ROOT_DEV_CLUSTER_NAME}}'
        current_context="$(kubectl config current-context)"
        test "$current_context" = "$expected_context" || {
          printf 'Development deployment requires context %s; current context is %s.\n' \
            "$expected_context" "$current_context" >&2
          printf 'Run: kubectl config use-context %s\n' "$expected_context" >&2
          exit 1
        }
      - >-
        KUBE4HA_TF_VARS_FILE="{{.DEV_RESOLVED_TF_VARS_FILE}}"
        ./scripts/with-opentofu-environment.sh
        runtime "{{.ROOT_DIR}}" "{{.ROOT_DIR}}" "{{.ROOT_CONFIG_DIR}}" --
        env
        KUBE4HA_CONFIG_DIR="{{.ROOT_CONFIG_DIR}}"
        task --dir "{{.ROOT_DIR}}" _deploy-dev

  _deploy-dev:
    # The credential wrapper invokes this in a child Task process, so Task
    # must permit it as an entrypoint.
    cmds:
      - task: infra:apply
      - |
        release_name="$(tofu -chdir="{{.ROOT_DIR}}/infra" output -raw helm_release_name)"
        namespace="$(tofu -chdir="{{.ROOT_DIR}}/infra" output -raw kubernetes_namespace)"
        case "$release_name" in
          ''|*[!a-z0-9.-]*|[.-]*|*[.-])
            echo 'OpenTofu returned an invalid Helm release name.' >&2
            exit 1
            ;;
        esac
        case "$namespace" in
          ''|*[!a-z0-9-]*|-*|*-)
            echo 'OpenTofu returned an invalid Kubernetes namespace.' >&2
            exit 1
            ;;
        esac
        env \
          RELEASE_NAME="$release_name" \
          NAMESPACE="$namespace" \
          KUBE4HA_PRIVATE_HELM_VALUES_FILE="{{.ROOT_DIR}}/examples/values-kind.yaml" \
          task --dir "{{.ROOT_DIR}}" helm:deploy

  destroy-dev:
    desc: Remove the development deployment, infrastructure, and Kind cluster
    vars:
      DEV_TF_VARS_FILE: '{{.KUBE4HA_TF_VARS_FILE | default .DOMOTIC_TF_VARS_FILE | default .ROOT_TOFU_VARS_PATH}}'
      DEV_RESOLVED_TF_VARS_FILE: '{{if isAbs (toString .DEV_TF_VARS_FILE)}}{{.DEV_TF_VARS_FILE}}{{else}}{{joinPath .USER_WORKING_DIR (toString .DEV_TF_VARS_FILE)}}{{end}}'
    cmds:
      - |
        expected_context='kind-{{.ROOT_DEV_CLUSTER_NAME}}'
        current_context="$(kubectl config current-context)"
        test "$current_context" = "$expected_context" || {
          printf 'Refusing to destroy through context %s; expected %s.\n' \
            "$current_context" "$expected_context" >&2
          exit 1
        }
      - >-
        KUBE4HA_TF_VARS_FILE="{{.DEV_RESOLVED_TF_VARS_FILE}}"
        ./scripts/with-opentofu-environment.sh
        runtime "{{.ROOT_DIR}}" "{{.ROOT_DIR}}" "{{.ROOT_CONFIG_DIR}}" --
        env
        KUBE4HA_CONFIG_DIR="{{.ROOT_CONFIG_DIR}}"
        task --dir "{{.ROOT_DIR}}" _destroy-dev
      - task: dev:destroy
        vars:
          CLUSTER_NAME: '{{.ROOT_DEV_CLUSTER_NAME}}'

  _destroy-dev:
    # Keep this callable for the same reason as _deploy-dev.
    cmds:
      - task: infra:init
      - |
        release_name="$(tofu -chdir="{{.ROOT_DIR}}/infra" output -raw helm_release_name)"
        namespace="$(tofu -chdir="{{.ROOT_DIR}}/infra" output -raw kubernetes_namespace)"
        case "$release_name" in
          ''|*[!a-z0-9.-]*|[.-]*|*[.-])
            echo 'OpenTofu returned an invalid Helm release name.' >&2
            exit 1
            ;;
        esac
        case "$namespace" in
          ''|*[!a-z0-9-]*|-*|*-)
            echo 'OpenTofu returned an invalid Kubernetes namespace.' >&2
            exit 1
            ;;
        esac
        task --dir "{{.ROOT_DIR}}" helm:uninstall \
          RELEASE_NAME="$release_name" \
          NAMESPACE="$namespace"
      - task: infra:destroy
