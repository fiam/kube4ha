# Default values for homeassistant.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

configSeed:
  enabled: true
  # seed initializes chart defaults and integrations without overwriting
  # user-managed files; restore writes only the minimal configuration needed
  # on a blank volume to expose Home Assistant's native backup restoration.
  # Set enabled=false only when the PVC is already populated independently.
  mode: seed
  image:
    repository: busybox
    tag: "1.36.1"
    pullPolicy: IfNotPresent
  resources: {}

# Deliver user-selected Home Assistant custom integrations to the writable
# configuration PVC. No additional integrations are selected here. Local sources must
# be packaged below this chart's files directory; a user-managed Git submodule
# can provide a separately versioned source.
# Remote sources must be immutable tar.gz archives with a pinned SHA-256;
# archivePath points at the directory containing that integration's
# manifest.json. name is the Home Assistant integration domain and may contain
# underscores. The installer tracks only the directories it manages, so
# unrelated custom_components on the PVC are preserved. See
# CUSTOM_INTEGRATIONS.md.
customComponents:
  local: []
  remote: []
  # - name: example_integration
  #   url: https://github.com/example/integration/archive/0123456789abcdef.tar.gz
  #   sha256: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  #   archivePath: integration-0123456789abcdef/custom_components/example_integration
  installer:
    image:
      repository: alpine
      tag: "3.22.1"
      pullPolicy: IfNotPresent
    resources: {}

# Install HACS (Home Assistant Community Store) from its pinned GitHub release
# archive into /config/custom_components/hacs, with the same immutable,
# checksum-verified delivery as customComponents.remote.
# LOCKSTEP: when bumping the default Home Assistant version (image.tag /
# Chart.yaml appVersion), bump hacs.version to the latest HACS release that
# supports it and recompute sha256 from
# https://github.com/hacs/integration/releases/download/<version>/hacs.zip.
# See HOME_ASSISTANT_COMPATIBILITY.md and CUSTOM_INTEGRATIONS.md.
# HACS still requires one-time manual setup in the UI (GitHub device flow).
hacs:
  enabled: true
  version: "2.0.5"
  sha256: 97be6b824a4f38e683728cc6dd72367f6b8bad0a43428b1b3b987a3087adf413

# Create or authenticate the admin account through Home Assistant's built-in
# but undocumented onboarding/login flows. OpenTofu seed mode always enables
# this hook and supplies the Secret; restore mode disables it. The authenticated
# hook also creates missing MQTT, Matter, and R2 entries through their config
# flows and reconciles HTTP proxy settings. It preserves completed onboarding and never
# replaces an existing owner or password. Read HOME_ASSISTANT_COMPATIBILITY.md
# before changing the Home Assistant image.
onboarding:
  enabled: false
  activeDeadlineSeconds: 600
  existingSecret:
    name: ""
    nameKey: name
    usernameKey: username
    passwordKey: password
    languageKey: language
  resources: {}

# Run the pinned OHF Matter Server in its own pod on the host network, pinned
# to Home Assistant's node. Home Assistant rollouts therefore never restart the
# controller or force paired devices through a new session handshake.
# Seed-mode onboarding creates a missing Matter entry pointing at loopback;
# existing entries (including external servers) are preserved. Pair devices
# using the Companion app. Thread devices also need a Thread border router.
# Its live fabric keys live on a separate retained PVC. A pre-backup hook
# stages a snapshot inside HA's configuration for native backups.
# See DEPLOYMENT.md for host networking and BACKUP.md for recovery.
matterServer:
  enabled: true
  image:
    repository: ghcr.io/matter-js/matterjs-server
    tag: "1.4.0"
    pullPolicy: IfNotPresent
  port: 5580
  # Empty lets Matter choose the interface; set the physical LAN interface on
  # hosts with multiple interfaces (for example enp1s0, not cni0 or flannel.1).
  primaryInterface: ""
  timeSync:
    # Opt in only when the Kubernetes host clock is reliably NTP synchronized.
    # The bundled HA helper supplies and tracks hass.config.time_zone.
    enabled: false
  backup:
    # Bundle the kube4ha_matter_backup integration and stage a fresh snapshot
    # before every native HA backup. The live storage tree is copied without
    # stopping Matter, so paired devices keep their sessions.
    # Restore mode stops Matter automatically. Resuming seed mode restores a
    # snapshot into an empty Matter claim and never overwrites existing data.
    enabled: true
    # Node-local directory holding the supervisor's control socket. It is
    # shared only between the Home Assistant and Matter pods on that node and
    # is owned by the Matter user with mode 0700.
    controlPath: /run/kube4ha-matter
  persistence:
    # Empty creates <homeassistant-fullname>-matter-pvc, retained on uninstall
    # or disable. An existing claim must be writable by UID/GID 1000.
    existingClaim: ""
    size: 1Gi
    # Empty inherits config.volume.storageClass (then the cluster default).
    storageClass: ""
  podAnnotations: {}
  resources: {}

# Create Home Assistant's official Cloudflare R2 backup integration through its
# config flow in authenticated seed mode when no matching entry exists.
# OpenTofu supplies this block and creates the referenced Secret when
# r2_backup_bucket_name is configured.
r2Backup:
  enabled: false
  bucket: ""
  endpointUrl: ""
  prefix: home-assistant
  existingSecret:
    name: ""
    accessKeyIdKey: access_key_id
    secretAccessKeyKey: secret_access_key
  # With OpenTofu, this defaults to daily backups retained for seven copies
  # when R2 is enabled in seed mode. Set existingSecret.name to encrypt them;
  # leave it empty for unencrypted backups. The onboarding hook initializes
  # only an unconfigured backup schedule; later UI changes remain owned by
  # Home Assistant.
  automatic:
    enabled: false
    agentName: ""
    retentionCopies: 7
    # Empty uses Home Assistant's early-morning default plus randomized jitter.
    time: ""
    existingSecret:
      name: ""
      passwordKey: password

# Periodically ask Zigbee2MQTT for its supported data-directory backup and
# stage the latest ZIP inside /config. Home Assistant's native backup includes
# that file with the rest of its configuration. The CronJob mounts only the
# Home Assistant claim and is scheduled onto the Home Assistant pod's node so
# it remains compatible with ReadWriteOnce volumes.
zigbee2mqttBackup:
  enabled: false
  schedule: "17 * * * *"
  directory: .kube4ha/zigbee2mqtt
  timeoutSeconds: 120
  startingDeadlineSeconds: 1800
  activeDeadlineSeconds: 300
  backoffLimit: 2
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  image:
    repository: eclipse-mosquitto
    tag: "2.1.2-alpine"
    pullPolicy: IfNotPresent
  mqtt:
    server: ""
    port: 1883
    baseTopic: zigbee2mqtt
    existingSecret:
      name: ""
      usernameKey: username
      passwordKey: password
  podAnnotations: {}
  resources: {}

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: "homeassistant/home-assistant"
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  # Pin exact patches: see HOME_ASSISTANT_COMPATIBILITY.md before changing.
  tag: "2026.10.4"

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 80

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# -- Expose the service via gateway-api HTTPRoute
# Requires Gateway API resources and suitable controller installed within the cluster
# (see: https://gateway-api.sigs.k8s.io/guides/)
httpRoute:
  # HTTPRoute enabled.
  enabled: true
  # HTTPRoute annotations.
  annotations: {}
  # Which Gateways this Route is attached to.
  parentRefs:
  - name: gateway
    sectionName: http
    # namespace: default
  # Hostnames matching HTTP header.
  hostnames:
  - homeassistant.local
  # List of rules and filters applied.
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
  #   filters:
  #   - type: RequestHeaderModifier
  #     requestHeaderModifier:
  #       set:
  #       - name: My-Overwrite-Header
  #         value: this-is-the-only-value
  #       remove:
  #       - User-Agent
  # - matches:
  #   - path:
  #       type: PathPrefix
  #       value: /echo
  #     headers:
  #     - name: version
  #       value: v2

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Mount the host's system D-Bus socket directory read-only so Home Assistant
# can reach BlueZ-managed Bluetooth adapters (see DEPLOYMENT.md). The container
# path is always /run/dbus; set path to /var/run/dbus if the host keeps its bus
# there. The Directory hostPath fails pod startup on hosts without a system bus
# (for example Kind nodes); disable it there, as examples/values-kind.yaml does.
hostDbus:
  enabled: true
  path: /run/dbus

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

config:
  # Reconciled through Home Assistant's WebSocket API on every seed-mode Helm
  # install/upgrade. The UI remains editable, but a later deployment restores
  # these declared values.
  name: Home
  external_url: http://example.com
  internal_url: http://homeassistant.local
  http:
    useXForwardedFor: true
    trustedProxies:
      - 10.0.0.0/8
  mqtt:
    server: mosquitto.default.svc.cluster.local
    port: 1883
  volume:
    size: 10Gi
    # Empty uses the cluster's default StorageClass.
    storageClass: ""

logger:
  default: info
