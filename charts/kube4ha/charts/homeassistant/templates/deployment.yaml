{{- if not (has .Values.configSeed.mode (list "seed" "restore")) }}
{{- fail "configSeed.mode must be seed or restore" }}
{{- end }}
{{- $componentNames := dict }}
{{- $matterRunning := and .Values.matterServer.enabled (eq .Values.configSeed.mode "seed") }}
{{- if .Values.matterServer.enabled }}
{{- if or .Values.autoscaling.enabled (ne (int .Values.replicaCount) 1) }}
{{- fail "matterServer requires replicaCount=1 and autoscaling.enabled=false to protect its fabric storage" }}
{{- end }}
{{- if or (lt (int .Values.matterServer.port) 1024) (gt (int .Values.matterServer.port) 65535) (eq (int .Values.matterServer.port) 8123) }}
{{- fail "matterServer.port must be between 1024 and 65535 and must not be Home Assistant's port 8123" }}
{{- end }}
{{- if not (regexMatch "^[0-9]+\\.[0-9]+\\.[0-9]+$" .Values.matterServer.image.tag) }}
{{- fail "matterServer.image.tag must be an exact release version such as 1.4.0" }}
{{- end }}
{{- end }}
{{- range $component := concat .Values.customComponents.local .Values.customComponents.remote }}
{{- if or (gt (len $component.name) 50) (not (regexMatch "^[a-z][a-z0-9_]*$" $component.name)) }}
{{- fail (printf "custom component name %q must be a lowercase Home Assistant integration domain of at most 50 characters" $component.name) }}
{{- end }}
{{- if hasKey $componentNames $component.name }}
{{- fail (printf "custom component name %q must be unique" $component.name) }}
{{- end }}
{{- $_ := set $componentNames $component.name true }}
{{- end }}
{{- if .Values.hacs.enabled }}
{{- if not (regexMatch "^[0-9]+\\.[0-9]+\\.[0-9]+$" .Values.hacs.version) }}
{{- fail "hacs.version must be an exact release version such as 2.0.5" }}
{{- end }}
{{- if not (regexMatch "^[a-fA-F0-9]{64}$" .Values.hacs.sha256) }}
{{- fail "hacs.sha256 must contain 64 hexadecimal characters" }}
{{- end }}
{{- if hasKey $componentNames "hacs" }}
{{- fail "customComponents must not declare hacs while hacs.enabled is true" }}
{{- end }}
{{- end }}
{{- if and .Values.matterServer.backup.enabled (hasKey $componentNames "kube4ha_matter_backup") }}
{{- fail "kube4ha_matter_backup is reserved for the chart's native Matter backup integration" }}
{{- end }}
{{- if .Values.hostDbus.enabled }}
{{- if not (hasPrefix "/" .Values.hostDbus.path) }}
{{- fail "hostDbus.path must be an absolute host path" }}
{{- end }}
{{- range concat .Values.volumes .Values.volumeMounts }}
{{- if eq .name "host-dbus" }}
{{- fail "volumes and volumeMounts must not define host-dbus while hostDbus.enabled is true; remove the manual D-Bus snippet from your values (see DEPLOYMENT.md) or set hostDbus.enabled=false" }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "homeassistant.fullname" . }}
  labels:
    {{- include "homeassistant.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "homeassistant.selectorLabels" . | nindent 6 }}
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        configmap.revision: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if or .Values.customComponents.local .Values.customComponents.remote }}
        custom-components.revision: {{ printf "%s\n%s" (include (print $.Template.BasePath "/custom-components-configmaps.yaml") .) (toJson .Values.customComponents.remote) | sha256sum }}
        {{- end }}
        {{- if .Values.hacs.enabled }}
        hacs.revision: {{ toJson .Values.hacs | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}{{- toYaml . | nindent 8 }}{{- end }}
      labels:
        {{- include "homeassistant.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        app.kubernetes.io/component: server
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "homeassistant.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      initContainers:
        {{- if .Values.matterServer.backup.enabled }}
        - name: matter-backup-install
          image: "{{ .Values.configSeed.image.repository }}:{{ .Values.configSeed.image.tag }}"
          imagePullPolicy: {{ .Values.configSeed.image.pullPolicy }}
          command:
            - sh
            - -ec
            - |
              target=/config/custom_components/kube4ha_matter_backup
              mkdir -p /config/custom_components
              rm -rf "$target.tmp"
              mkdir "$target.tmp"
              cp /source/* "$target.tmp/"
              rm -rf "$target"
              mv "$target.tmp" "$target"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: matter-backup-integration
              mountPath: /source
              readOnly: true
        {{- end }}
        {{- if .Values.configSeed.enabled }}
        - name: config-seed
          image: "{{ .Values.configSeed.image.repository }}:{{ .Values.configSeed.image.tag }}"
          imagePullPolicy: {{ .Values.configSeed.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -eu
              {{- if eq .Values.configSeed.mode "seed" }}
              files="configuration.yaml automations.yaml scripts.yaml scenes.yaml"
              for rel in $files; do
                echo "Processing default file: ${rel}"
                file="/defaults/$(echo "$rel" | tr '/' '-')"
                target="/config/${rel}"
                seed="/config/.seed/${rel}"
                mkdir -p "$(dirname "$target")" "$(dirname "$seed")"
                if [ ! -f "$seed" ]; then
                  if [ ! -f "$target" ]; then
                    echo "Initializing ${rel}"
                    cp "$file" "$target"
                  else
                    echo "Adopting existing ${rel} without changing it"
                  fi
                  cp "$file" "$seed"
                elif ! cmp -s "$file" "$seed"; then
                  if [ ! -f "$target" ] || cmp -s "$target" "$seed"; then
                    echo "Chart default updated for ${rel}, refreshing unchanged file"
                    cp "$file" "$target"
                  else
                    echo "Preserving user-managed ${rel}"
                  fi
                  cp "$file" "$seed"
                elif [ ! -f "$target" ]; then
                  echo "Missing ${rel}, restoring from defaults"
                  cp "$seed" "$target"
                fi
              done

              {{- else }}
              # A blank volume needs a minimal configuration to start the
              # frontend and expose Home Assistant's native restore flow. The
              # restored configuration replaces this file on the PVC; unlike a
              # subPath mount, it is not permanently shadowed by the chart.
              if [ ! -f /config/configuration.yaml ]; then
                echo "Creating minimal configuration for native restore"
                cp /defaults/restore-configuration.yaml /config/configuration.yaml
              else
                echo "Native-restore mode: preserving all Home Assistant configuration"
              fi
              {{- end }}
          volumeMounts:
            - name: config
              mountPath: /config
            - name: configuration-files
              mountPath: /defaults
          {{- with .Values.configSeed.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
        {{- range $component := .Values.customComponents.local }}
        {{- $componentKey := include "homeassistant.customComponentKey" $component.name }}
        - name: custom-{{ $componentKey }}
          image: "{{ $.Values.customComponents.installer.image.repository }}:{{ $.Values.customComponents.installer.image.tag }}"
          imagePullPolicy: {{ $.Values.customComponents.installer.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -eu
              target="/config/custom_components/$COMPONENT_NAME"
              staging="/config/custom_components/.${COMPONENT_NAME}.tmp"
              test -f /component-source/manifest.json
              mkdir -p /config/custom_components
              rm -rf "$staging"
              mkdir -p "$staging"
              cp -R /component-source/. "$staging/"
              rm -rf "$target"
              mv "$staging" "$target"
          env:
            - name: COMPONENT_NAME
              value: {{ $component.name | quote }}
          volumeMounts:
            - name: config
              mountPath: /config
            - name: custom-{{ $componentKey }}
              mountPath: /component-source
              readOnly: true
          {{- with $.Values.customComponents.installer.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
        {{- range $component := .Values.customComponents.remote }}
        {{- $componentKey := include "homeassistant.customComponentKey" $component.name }}
        {{- if not (regexMatch "^[a-z][a-z0-9_]*$" $component.name) }}
        {{- fail (printf "customComponents.remote name %q must be a lowercase Home Assistant integration domain" $component.name) }}
        {{- end }}
        {{- if not (hasPrefix "https://" $component.url) }}
        {{- fail (printf "customComponents.remote[%s].url must use HTTPS" $component.name) }}
        {{- end }}
        {{- if not (regexMatch "^[a-fA-F0-9]{64}$" $component.sha256) }}
        {{- fail (printf "customComponents.remote[%s].sha256 must contain 64 hexadecimal characters" $component.name) }}
        {{- end }}
        {{- if or (eq $component.archivePath "") (hasPrefix "/" $component.archivePath) (contains ".." $component.archivePath) }}
        {{- fail (printf "customComponents.remote[%s].archivePath must be a safe relative path" $component.name) }}
        {{- end }}
        - name: custom-{{ $componentKey }}
          image: "{{ $.Values.customComponents.installer.image.repository }}:{{ $.Values.customComponents.installer.image.tag }}"
          imagePullPolicy: {{ $.Values.customComponents.installer.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -eu
              target="/config/custom_components/$COMPONENT_NAME"
              staging="/config/custom_components/.${COMPONENT_NAME}.tmp"
              mkdir -p /work/unpacked /config/custom_components
              wget -q -O /work/component.tar.gz "$COMPONENT_URL"
              echo "$COMPONENT_SHA256  /work/component.tar.gz" | sha256sum -c -
              if tar -tzf /work/component.tar.gz | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
                echo "Custom component archive contains an unsafe path" >&2
                exit 1
              fi
              tar -xzf /work/component.tar.gz -C /work/unpacked
              source="/work/unpacked/$COMPONENT_ARCHIVE_PATH"
              test -f "$source/manifest.json"
              rm -rf "$staging"
              mkdir -p "$staging"
              cp -R "$source"/. "$staging/"
              rm -rf "$target"
              mv "$staging" "$target"
          env:
            - name: COMPONENT_NAME
              value: {{ $component.name | quote }}
            - name: COMPONENT_URL
              value: {{ $component.url | quote }}
            - name: COMPONENT_SHA256
              value: {{ lower $component.sha256 | quote }}
            - name: COMPONENT_ARCHIVE_PATH
              value: {{ $component.archivePath | quote }}
          volumeMounts:
            - name: config
              mountPath: /config
            - name: custom-{{ $componentKey }}-work
              mountPath: /work
          {{- with $.Values.customComponents.installer.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
        {{- if .Values.hacs.enabled }}
        - name: hacs-install
          image: "{{ .Values.customComponents.installer.image.repository }}:{{ .Values.customComponents.installer.image.tag }}"
          imagePullPolicy: {{ .Values.customComponents.installer.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -eu
              target="/config/custom_components/hacs"
              staging="/config/custom_components/.hacs.tmp"
              mkdir -p /work/unpacked /config/custom_components
              wget -q -O /work/hacs.zip "$HACS_URL"
              echo "$HACS_SHA256  /work/hacs.zip" | sha256sum -c -
              if unzip -l /work/hacs.zip | awk 'NR > 3 && NF >= 4 { print $4 }' | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
                echo "HACS archive contains an unsafe path" >&2
                exit 1
              fi
              unzip -q /work/hacs.zip -d /work/unpacked
              test -f /work/unpacked/manifest.json
              rm -rf "$staging"
              mkdir -p "$staging"
              cp -R /work/unpacked/. "$staging/"
              rm -rf "$target"
              mv "$staging" "$target"
          env:
            - name: HACS_URL
              value: "https://github.com/hacs/integration/releases/download/{{ .Values.hacs.version }}/hacs.zip"
            - name: HACS_SHA256
              value: {{ lower .Values.hacs.sha256 | quote }}
          volumeMounts:
            - name: config
              mountPath: /config
            - name: hacs-work
              mountPath: /work
          {{- with .Values.customComponents.installer.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
        - name: custom-components-reconcile
          image: "{{ .Values.customComponents.installer.image.repository }}:{{ .Values.customComponents.installer.image.tag }}"
          imagePullPolicy: {{ .Values.customComponents.installer.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -eu
              state_dir=/config/.kube4ha
              state_file="$state_dir/managed-custom-components"
              desired_file="$state_file.new"
              mkdir -p "$state_dir" /config/custom_components
              legacy_state_file=/config/.domotic/managed-custom-components
              if [ ! -f "$state_file" ] && [ -f "$legacy_state_file" ]; then
                cp "$legacy_state_file" "$state_file"
              fi
              cat > "$desired_file" <<'EOF'
              {{- range $component := concat .Values.customComponents.local .Values.customComponents.remote }}
              {{ $component.name }}
              {{- end }}
              {{- if .Values.hacs.enabled }}
              hacs
              {{- end }}
              {{- if .Values.matterServer.backup.enabled }}
              kube4ha_matter_backup
              {{- end }}
              EOF
              if [ -f "$state_file" ]; then
                while IFS= read -r component_name; do
                  case "$component_name" in
                    ''|*[!a-z0-9_]*) continue ;;
                  esac
                  if ! grep -Fx "$component_name" "$desired_file" >/dev/null; then
                    rm -rf "/config/custom_components/$component_name"
                  fi
                done < "$state_file"
              fi
              mv "$desired_file" "$state_file"
          volumeMounts:
            - name: config
              mountPath: /config
          {{- with .Values.customComponents.installer.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            privileged: true
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
                - SYS_ADMIN
          image: "{{ .Values.image.repository | default "homeassistant/home-assistant" }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: KUBE4HA_MATTER_BACKUP_ENABLED
              value: {{ (and $matterRunning .Values.matterServer.backup.enabled) | quote }}
          ports:
            - name: http
              containerPort: 8123
              protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /config
            {{- if and $matterRunning .Values.matterServer.backup.enabled }}
            - name: matter-control
              mountPath: /run/kube4ha-matter
            {{- end }}
            {{- if .Values.hostDbus.enabled }}
            - name: host-dbus
              mountPath: /run/dbus
              readOnly: true
            {{- end }}
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        {{- if .Values.matterServer.backup.enabled }}
        - name: matter-backup-integration
          configMap:
            name: {{ include "homeassistant.fullname" . }}-matter-backup-integration
        {{- end }}
        {{- if and $matterRunning .Values.matterServer.backup.enabled }}
        # Shared with the Matter pod on the same node; the HA container talks
        # to the supervisor's Unix socket here before each native backup.
        - name: matter-control
          hostPath:
            path: {{ .Values.matterServer.backup.controlPath | quote }}
            type: DirectoryOrCreate
        {{- end }}
        - name: config
          persistentVolumeClaim:
            claimName: {{ include "homeassistant.fullname" . }}-pvc
        - name: configuration-files
          configMap:
            name: {{ include "homeassistant.fullname" . }}-configuration
        {{- range $component := .Values.customComponents.local }}
        {{- $source := $component.source | trimSuffix "/" }}
        - name: custom-{{ include "homeassistant.customComponentKey" $component.name }}
          configMap:
            name: {{ include "homeassistant.customComponentName" (dict "root" $ "name" $component.name) }}
            items:
              {{- range $file, $_ := $.Files.Glob (printf "%s/**" $source) }}
              {{- $relative := $file | trimPrefix (printf "%s/" $source) }}
              - key: {{ $relative | sha256sum | trunc 32 }}
                path: {{ $relative }}
              {{- end }}
        {{- end }}
        {{- range $component := .Values.customComponents.remote }}
        {{- $componentKey := include "homeassistant.customComponentKey" $component.name }}
        - name: custom-{{ $componentKey }}-work
          emptyDir: {}
        {{- end }}
        {{- if .Values.hacs.enabled }}
        - name: hacs-work
          emptyDir: {}
        {{- end }}
        {{- if .Values.hostDbus.enabled }}
        - name: host-dbus
          hostPath:
            path: {{ .Values.hostDbus.path | quote }}
            type: Directory
        {{- end }}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
