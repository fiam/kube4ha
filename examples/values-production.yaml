# ==============================================================================
# Production kube4ha Configuration Example
# ==============================================================================
# Full-featured configuration with HTTPRoute, persistence, and resource limits

# Zigbee2MQTT Configuration
zigbee2mqtt:
  # OpenTofu supplies the Secret/ConfigMap references, MQTT endpoint, and
  # local HTTPRoute hostname in infra/helm-values.yaml.

  image:
    tag: "2.14.2"  # Pin this and test upgrades with your coordinator

  config:
    serial:
      port: /dev/ttyACM0
      adapter: ember

  # Note: Network settings (pan_id, channel) managed by OpenTofu
  
  persistence:
    enabled: true
    size: 2Gi
    storageClass: "local-path"  # Adjust for your cluster
  
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  
  httpRoute:
    enabled: true
    parentRefs:
      - name: traefik-gateway
        namespace: kube-system
        sectionName: web

# Home Assistant Configuration  
homeassistant:
  # OpenTofu supplies external/internal URLs, MQTT, R2, and the local
  # HTTPRoute hostname in infra/helm-values.yaml.
  image:
    tag: "2026.10.4"  # Pin this and test upgrades before production use
  
  config:
    # Reconciled through the Home Assistant API on each seed-mode deployment.
    # Configure regional settings in the Home Assistant UI.
    name: "My Smart Home"
    volume:
      size: 20Gi
      storageClass: "local-path"
  
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 1Gi
  
  httpRoute:
    enabled: true
    parentRefs:
      - name: traefik-gateway
        namespace: kube-system
        sectionName: web

# Cloudflared Tunnel
cloudflared:
  replicaCount: 2  # High availability

  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

# Mosquitto MQTT Broker
mosquitto:
  image:
    tag: "2.1.2-alpine"  # Pin this and test upgrades before production use
  
  persistence:
    enabled: true
    size: 5Gi
    storageClass: "local-path"
  
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi
